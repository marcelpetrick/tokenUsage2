# -----------------------------------------------------------------------------
# tokenUsage2 CI
#
# Runs exactly the verification that runs locally: ./localPipeline.sh --noRun.
# The script sets up .venv with the pinned development tools, runs ruff lint and
# format check, ShellCheck, pytest with the branch-coverage gate and a demo
# smoke run, builds sdist and wheel, installs the wheel into a clean venv and
# checks the installed command; every stage is timed and a verdict closes the
# run. --noRun suppresses the final interactive dashboard launch.
# -----------------------------------------------------------------------------
name: tokenUsage2

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokenusage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate (Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Run the local pipeline
        run: ./localPipeline.sh --noRun --report-dir build/pipeline-logs

      - name: Show the pipeline verdict and the demo dashboard in the job summary
        if: always()
        run: |
          {
            echo '### tokenUsage2 — local pipeline'
            echo '```'
            cat build/pipeline-logs/summary.txt || echo 'the pipeline wrote no summary'
            echo '```'
            echo '### tokenUsage2 — demo frame'
            echo '```'
            .venv/bin/tokenusage2 --demo --once --color never --tz UTC --width 150 --height 44 \
              || echo 'no working .venv/bin/tokenusage2'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and distributions
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tokenusage2-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            coverage.xml
            dist/
            build/pipeline-logs/
